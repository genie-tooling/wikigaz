[tool.poetry]
name = "wiki2gaz-modern"
version = "1.0.0"
description = "Modernized pipeline for ingesting Wikipedia/Wikidata into MongoDB"
authors = ["Python Knowledge Integration Architect <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
sentence-transformers = "^2.2.2" # Or latest compatible version
python = "^3.9"

# Core Libraries
pymongo = "^4.6"       # MongoDB driver
ijson = "^3.2"         # Efficient streaming JSON parser
pyyaml = "^6.0"        # For YAML config loading
python-dotenv = "^1.0" # For loading .env files
tqdm = "^4.65"         # Progress bars
pydash = "^7.0"        # Utility library
requests = "^2.31"     # For downloads or future API interactions
# wikimapper = "^X.Y.Z" # Add if explicitly chosen and version known

[tool.poetry.group.dev.dependencies]
# Development/Testing Libraries
pytest = "^7.4"
pytest-cov = "^4.1"
mongomock = "^4.1" # For mocking Mongo in tests
black = "^23.12"   # Code formatter
flake8 = "^6.1"    # Linter
mypy = "^1.7"      # Static type checker
# Optional: Add memory-profiler if needed for testing
# memory-profiler = "^0.61"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    # Add other custom markers here if needed
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true # Start with true, can refine later
# Consider adding specific paths to check:
# files = ["scripts", "utils"]
